<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="'JetBrains Mono', ui-monospace, monospace">
  <rect width="720" height="430" fill="#050505"/>

  <!-- Reasoning layer -->
  <rect x="110" y="20" width="500" height="72" fill="hsl(150,65%,45%)" fill-opacity="0.06" stroke="hsl(150,65%,45%)" stroke-opacity="0.55"/>
  <text x="360" y="48" text-anchor="middle" font-size="14" fill="hsl(150,65%,45%)">REASONING &amp; TRIAGE</text>
  <text x="360" y="72" text-anchor="middle" font-size="11" fill="hsl(40,5%,55%)">Monitoring Webhooks · AWX / Aria · AI Agents</text>

  <!-- arrow down -->
  <g stroke="hsl(40,96%,52%)" stroke-opacity="0.6" stroke-width="1.5" fill="none">
    <line x1="360" y1="92" x2="360" y2="124"/>
    <polyline points="354,118 360,124 366,118"/>
  </g>
  <text x="378" y="112" font-size="11" fill="hsl(40,96%,52%)" fill-opacity="0.8">structured function invocations</text>

  <!-- split arrows -->
  <g stroke="hsl(40,96%,52%)" stroke-opacity="0.6" stroke-width="1.5" fill="none">
    <line x1="360" y1="124" x2="360" y2="140"/>
    <line x1="197" y1="140" x2="523" y2="140"/>
    <line x1="197" y1="140" x2="197" y2="160"/>
    <line x1="523" y1="140" x2="523" y2="160"/>
    <polyline points="191,154 197,160 203,154"/>
    <polyline points="517,154 523,160 529,154"/>
  </g>

  <!-- Orchestration layer -->
  <rect x="60" y="168" width="274" height="120" fill="hsl(40,96%,52%)" fill-opacity="0.05" stroke="hsl(40,96%,52%)" stroke-opacity="0.45"/>
  <text x="197" y="194" text-anchor="middle" font-size="14" fill="hsl(40,96%,52%)">ORCHESTRATION</text>
  <text x="197" y="212" text-anchor="middle" font-size="11" fill="hsl(40,12%,88%)">Python</text>
  <text x="197" y="236" text-anchor="middle" font-size="10.5" fill="hsl(40,5%,55%)">Cloud &amp; Hypervisor APIs</text>
  <text x="197" y="254" text-anchor="middle" font-size="10.5" fill="hsl(40,5%,55%)">Telemetry &amp; Pre-checks</text>
  <text x="197" y="272" text-anchor="middle" font-size="10.5" fill="hsl(40,5%,55%)">Dynamic Decision Trees</text>

  <!-- Configuration layer -->
  <rect x="386" y="168" width="274" height="120" fill="hsl(40,96%,52%)" fill-opacity="0.05" stroke="hsl(40,96%,52%)" stroke-opacity="0.45"/>
  <text x="523" y="194" text-anchor="middle" font-size="14" fill="hsl(40,96%,52%)">CONFIGURATION</text>
  <text x="523" y="212" text-anchor="middle" font-size="11" fill="hsl(40,12%,88%)">Ansible</text>
  <text x="523" y="236" text-anchor="middle" font-size="10.5" fill="hsl(40,5%,55%)">OS &amp; Service Baselines</text>
  <text x="523" y="254" text-anchor="middle" font-size="10.5" fill="hsl(40,5%,55%)">Idempotent Host Tasks</text>
  <text x="523" y="272" text-anchor="middle" font-size="10.5" fill="hsl(40,5%,55%)">Safe Filesystem Mutators</text>

  <!-- arrows to targets -->
  <g stroke="hsl(40,96%,52%)" stroke-opacity="0.6" stroke-width="1.5" fill="none">
    <line x1="197" y1="288" x2="197" y2="318"/>
    <polyline points="191,312 197,318 203,312"/>
    <line x1="523" y1="288" x2="523" y2="318"/>
    <polyline points="517,312 523,318 529,312"/>
  </g>

  <!-- targets -->
  <rect x="90" y="326" width="214" height="40" fill="none" stroke="hsl(40,5%,55%)" stroke-opacity="0.45"/>
  <text x="197" y="350" text-anchor="middle" font-size="11" fill="hsl(40,12%,88%)">Cloud APIs · SaaS · K8s</text>
  <rect x="416" y="326" width="214" height="40" fill="none" stroke="hsl(40,5%,55%)" stroke-opacity="0.45"/>
  <text x="523" y="350" text-anchor="middle" font-size="11" fill="hsl(40,12%,88%)">Bare Metal · VMs · Linux</text>

  <!-- caption -->
  <text x="360" y="406" text-anchor="middle" font-size="11" fill="hsl(40,5%,55%)">reason decides, python coordinates, ansible enforces</text>
</svg>
