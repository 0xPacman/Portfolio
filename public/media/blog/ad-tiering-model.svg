<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" font-family="'JetBrains Mono', ui-monospace, monospace">
  <rect width="720" height="350" fill="#050505"/>

  <!-- Tier 0 -->
  <rect x="110" y="20" width="500" height="68" fill="hsl(0,72%,51%)" fill-opacity="0.07" stroke="hsl(0,72%,51%)" stroke-opacity="0.6"/>
  <text x="360" y="48" text-anchor="middle" font-size="14" fill="hsl(0,72%,60%)">TIER 0</text>
  <text x="360" y="70" text-anchor="middle" font-size="11" fill="hsl(40,5%,55%)">Domain Controllers · PKI / ADCS · Identity Sync · Tier-0 Admins</text>

  <!-- arrow 0->1 -->
  <g stroke="hsl(40,96%,52%)" stroke-opacity="0.6" stroke-width="1.5" fill="none">
    <line x1="360" y1="96" x2="360" y2="122"/>
    <polyline points="354,116 360,122 366,116"/>
  </g>
  <text x="378" y="112" font-size="11" fill="hsl(40,96%,52%)" fill-opacity="0.8">no downstream logon</text>

  <!-- Tier 1 -->
  <rect x="110" y="130" width="500" height="68" fill="hsl(40,96%,52%)" fill-opacity="0.05" stroke="hsl(40,96%,52%)" stroke-opacity="0.45"/>
  <text x="360" y="158" text-anchor="middle" font-size="14" fill="hsl(40,96%,52%)">TIER 1</text>
  <text x="360" y="180" text-anchor="middle" font-size="11" fill="hsl(40,5%,55%)">Application Servers · Hypervisors · Storage · Databases</text>

  <!-- arrow 1->2 -->
  <g stroke="hsl(40,96%,52%)" stroke-opacity="0.6" stroke-width="1.5" fill="none">
    <line x1="360" y1="206" x2="360" y2="232"/>
    <polyline points="354,226 360,232 366,226"/>
  </g>
  <text x="378" y="222" font-size="11" fill="hsl(40,96%,52%)" fill-opacity="0.8">no downstream logon</text>

  <!-- Tier 2 -->
  <rect x="110" y="240" width="500" height="68" fill="none" stroke="hsl(40,5%,55%)" stroke-opacity="0.45"/>
  <text x="360" y="268" text-anchor="middle" font-size="14" fill="hsl(40,12%,88%)">TIER 2</text>
  <text x="360" y="290" text-anchor="middle" font-size="11" fill="hsl(40,5%,55%)">End-User Workstations &amp; Laptops</text>

  <!-- caption -->
  <text x="360" y="338" text-anchor="middle" font-size="11" fill="hsl(40,5%,55%)">credentials only ever flow sideways or down — never up</text>
</svg>
